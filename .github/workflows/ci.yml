name: Cross-platform checks

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  linux-focused:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-22.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install and focused checks
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[mcp,dev]"
          bash -n scripts/install.sh scripts/uninstall.sh
          python -m skilllayer --version
          python -m skilllayer doctor --json
          python -m skilllayer diagnostics --json
          python -m skilllayer update-check --json
          python -m pytest tests/test_policy.py tests/test_target_environment_execution.py tests/test_environment_remediation.py tests/test_diagnostics.py tests/test_safe_code_change_workflow.py tests/test_release_readiness_workflow.py tests/test_subprocess_lifecycle_safety.py -q -p no:cacheprovider

  ubuntu-full-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[mcp,dev]"
          python -m pip install -r experiments/secure_context_day1/requirements-presidio.txt
      - name: Install pinned Gitleaks for synthetic probe
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Full suite
        env:
          SECURE_CONTEXT_GITLEAKS: ${{ runner.temp }}/gitleaks
        run: python -u -m pytest tests/ -q -p no:cacheprovider
