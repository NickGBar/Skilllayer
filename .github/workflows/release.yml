name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag and install test dependencies
        run: |
          python scripts/check_tag_version.py "${GITHUB_REF_NAME}"
          # The same test environment as ubuntu-full-suite in ci.yml, so a tag runs the suite CI passed.
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install -e ".[mcp,dev]"
          python -m pip install -r experiments/secure_context_day1/requirements-presidio.txt
          python -m skilllayer policy check --json
          python -m skilllayer policy dry-run safe-change --json
          python -m skilllayer policy dry-run release-readiness --json
      - name: Install pinned Gitleaks for synthetic probe
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Run full suite
        env:
          SECURE_CONTEXT_GITLEAKS: ${{ runner.temp }}/gitleaks
        run: python -u -m pytest tests/ -q -p no:cacheprovider
      - name: Build artifacts
        run: python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Artifact boundary and checksum scan
        run: |
          ! find "$RUNNER_TEMP/dist" -type f \( -name '*.env' -o -name '*diagnostics*' -o -name '*results*' \) -print -quit | grep -q .
          sha256sum "$RUNNER_TEMP/dist"/* > "$RUNNER_TEMP/dist/SHA256SUMS"
      - name: Fresh wheel smoke
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install "$RUNNER_TEMP/dist/"*.whl
          "$RUNNER_TEMP/release-venv/bin/python" -m skilllayer --version
          "$RUNNER_TEMP/release-venv/bin/python" -m skilllayer doctor --json
          "$RUNNER_TEMP/release-venv/bin/python" -m skilllayer diagnostics --json
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skilllayer-${{ github.ref_name }}
          path: ${{ runner.temp }}/dist/*

  publish:
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skilllayer-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes=false --title "SkillLayer ${GITHUB_REF_NAME}"
