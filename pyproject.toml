[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skilllayer"
version = "0.2.0"
description = "Required checks for code written by AI agents, with signed receipts; plus local CLI and MCP tools for coding agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nicolas Baranov", email = "nicolya.baranov@gmail.com" }]
license = { text = "BUSL-1.1" }
dependencies = [
    "psutil>=5.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# mcp 2.x removed mcp.server.fastmcp (FastMCP is now MCPServer); the server is written against 1.x.
mcp = ["mcp>=1.0,<2"]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0"]
benchmark = ["anthropic>=0.58"]

[project.scripts]
skilllayer = "skilllayer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skilllayer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# examples/verify-demo/template holds a demo repository whose last test fails on purpose.
addopts = "--ignore=examples"
